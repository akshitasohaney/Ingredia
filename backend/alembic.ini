# Ingredia — Alembic configuration
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts, relative to this file
script_location = migrations

# SQLite database URL — overridden at runtime via env.py reading app.config
sqlalchemy.url = sqlite:///ingredia.db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
